[project]
name = "incident-response-agent"
version = "0.1.0"
description = "Autonomous incident-response agent (LangGraph) + synthetic incident datasets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "rich>=13.0",
  "httpx>=0.27",
  "langgraph>=0.2",
]

[project.optional-dependencies]
agent = [
  "langgraph-checkpoint-sqlite>=0.1",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
